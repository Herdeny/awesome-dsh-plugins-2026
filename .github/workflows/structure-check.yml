name: Structure Check

# Guards the structural invariants a link checker cannot see:
#   1. The markdown stays well-formed (in-page anchors resolve, table rows
#      have consistent column counts, no malformed entries or open fences).
#   2. The project total counts canonical entries, never duplicated highlights.
#   3. The zh/en READMEs stay in structural lockstep (same headings, same
#      entries in the same order).

on:
  pull_request:
    paths:
      - "README.md"
      - "README.en.md"
      - "scripts/**"
      - "data/recent-additions.json"
      - ".github/workflows/structure-check.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README.en.md"
      - "scripts/**"
      - "data/recent-additions.json"
      - ".github/workflows/structure-check.yml"
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: zh/en lockstep audit
        run: python3 scripts/sync_audit.py

      - name: Markdown structure check
        run: python3 scripts/check_markdown.py

      - name: Project count and QC coverage
        run: python3 scripts/refresh_counts.py

      - name: Catalog formatting and recent additions
        run: python3 scripts/format_catalog.py

      - name: Historical QC distribution
        run: python3 scripts/update_qc_marks.py --check

      - name: Catalog regression checks
        run: python3 -m unittest discover -s scripts/tests -v
